<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/skillsbay-favicon.png" />
    <link rel="apple-touch-icon" href="/skillsbay-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillsBay</title>
    <script>
      (function() {
        try {
          var storageKey = 'skillsbay-ui-theme';
          var stored = localStorage.getItem(storageKey);
          var theme = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'dark';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
