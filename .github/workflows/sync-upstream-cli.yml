name: Sync Upstream Skills CLI

on:
  schedule:
    # Runs every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Skillsbay repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Sync upstream vercel-labs/skills source files
        run: |
          echo "Cloning latest vercel-labs/skills repository..."
          rm -rf /tmp/upstream-skills
          git clone --depth 1 https://github.com/vercel-labs/skills.git /tmp/upstream-skills

          echo "Syncing upstream files to packages/cli/src/..."
          # Sync all upstream src files while preserving our custom Skillsbay modules
          # `add.ts` owns SkillsBay's marketplace routing and CLI-only options.
          # Syncing the upstream version removes those integration points and
          # leaves the branded CLI unable to typecheck.
          rsync -av \
            --exclude="cli.ts" \
            --exclude="add.ts" \
            --exclude="skillsbay.ts" \
            --exclude="telemetry.ts" \
            /tmp/upstream-skills/src/ packages/cli/src/

          echo "Sync completed."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Typecheck CLI
        run: |
          pnpm --filter skillsbay build
          pnpm --filter skillsbay exec tsc --noEmit
        env:
          SKILLSBAY_API_URL: https://skillsbay.dev

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(cli): sync upstream vercel-labs/skills'
          title: 'chore(cli): sync upstream vercel-labs/skills'
          body: |
            ## Automated Upstream Sync: `vercel-labs/skills`
            
            This automated weekly pull request syncs the latest agent definitions, prompts, and installer enhancements from [vercel-labs/skills](https://github.com/vercel-labs/skills).
            
            ### Verification
            - Upstream source files copied into `packages/cli/src/`
            - Preserved `skillsbay.ts` (payment & marketplace flow) and `cli.ts` (branding & routing)
            - Bundled successfully via `tsup`
            - Typechecked with zero errors (`tsc --noEmit`)
          branch: chore/sync-upstream-skills
          delete-branch: true
