name: Deploy Skillsbay

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_cli:
        description: Publish the CLI even when no CLI files changed in this run
        required: false
        default: false
        type: boolean
      deploy_worker:
        description: Build, migrate, and deploy the Worker even when no deployable files changed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: skillsbay-production
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect release changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.cli.outputs.changed }}
      worker: ${{ steps.worker.outputs.changed }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed release surfaces
        id: cli
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed() {
            if [ "$EVENT_NAME" != "push" ]; then
              printf false
            elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              printf true
            elif git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- "$@"; then
              printf false
            else
              printf true
            fi
          }

          echo "changed=$(changed packages/cli)" >> "$GITHUB_OUTPUT"

      - name: Detect Worker, frontend, and migration changes
        id: worker
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- worker src public db/migrations packages/shared index.html package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json tsconfig.app.json tsconfig.node.json vite.config.ts wrangler.jsonc; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    name: Migrate D1 and deploy Worker
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true' || inputs.deploy_worker == true
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
      VITE_SKILL_REGISTRY_ADDRESS: ${{ vars.VITE_SKILL_REGISTRY_ADDRESS }}
      VITE_BASE_CHAIN_ID: ${{ vars.VITE_BASE_CHAIN_ID }}
      VITE_BASE_RPC_URL: ${{ vars.VITE_BASE_RPC_URL }}
      VITE_USDC_ADDRESS: ${{ vars.VITE_USDC_ADDRESS }}
      VITE_X402_NETWORK: ${{ vars.VITE_X402_NETWORK }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public build configuration
        run: |
          test -n "$VITE_PRIVY_APP_ID" || { echo "Set production variable VITE_PRIVY_APP_ID"; exit 1; }
          test -n "$VITE_SKILL_REGISTRY_ADDRESS" || { echo "Set production variable VITE_SKILL_REGISTRY_ADDRESS"; exit 1; }
          test -n "$VITE_BASE_CHAIN_ID" || { echo "Set production variable VITE_BASE_CHAIN_ID"; exit 1; }
          test -n "$VITE_BASE_RPC_URL" || { echo "Set production variable VITE_BASE_RPC_URL"; exit 1; }
          test -n "$VITE_USDC_ADDRESS" || { echo "Set production variable VITE_USDC_ADDRESS"; exit 1; }
          test -n "$VITE_X402_NETWORK" || { echo "Set production variable VITE_X402_NETWORK"; exit 1; }

      - name: Build Worker and marketplace
        run: pnpm build

      - name: Apply pending D1 migrations
        run: pnpm wrangler d1 migrations apply skillsbay --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish-cli:
    name: Publish CLI to npm
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true' || inputs.publish_cli == true
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: |
          test -n "$SKILLSBAY_API_URL" || { echo "npm environment variable SKILLSBAY_API_URL is required"; exit 1; }
          test -n "$SKILLSBAY_X402_NETWORK" || { echo "npm environment variable SKILLSBAY_X402_NETWORK is required"; exit 1; }
          pnpm --filter skillsbay build
        env:
          # Environment-scoped, build-time value embedded into the npm release.
          SKILLSBAY_API_URL: ${{ vars.SKILLSBAY_API_URL }}
          SKILLSBAY_X402_NETWORK: ${{ vars.SKILLSBAY_X402_NETWORK }}

      - name: Confirm the CLI version is new
        working-directory: packages/cli
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "skillsbay@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "skillsbay@${PACKAGE_VERSION} is already published. Bump packages/cli/package.json before merging CLI changes."
            exit 1
          fi

      - name: Publish CLI
        working-directory: packages/cli
        run: npm publish --access public
