name: Deploy SkillsBay

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_cli:
        description: Publish the CLI even when no CLI files changed in this run
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: skillsbay-production
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect release changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.cli.outputs.changed }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect CLI changes in this push
        id: cli
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- packages/cli; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
      VITE_SKILL_REGISTRY_ADDRESS: ${{ vars.VITE_SKILL_REGISTRY_ADDRESS }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public build configuration
        run: |
          test -n "$VITE_PRIVY_APP_ID" || { echo "Set production variable VITE_PRIVY_APP_ID"; exit 1; }
          test -n "$VITE_SKILL_REGISTRY_ADDRESS" || { echo "Set production variable VITE_SKILL_REGISTRY_ADDRESS"; exit 1; }

      - name: Build Worker and marketplace
        run: pnpm build

      - name: Apply pending D1 migrations
        run: pnpm wrangler d1 migrations apply skillsbay --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish-cli:
    name: Publish CLI to npm
    needs: [detect-changes, deploy-worker]
    if: needs.detect-changes.outputs.cli == 'true' || inputs.publish_cli == true
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter skillsbay build

      - name: Confirm the CLI version is new
        working-directory: packages/cli
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "skillsbay@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "skillsbay@${PACKAGE_VERSION} is already published. Bump packages/cli/package.json before merging CLI changes."
            exit 1
          fi

      - name: Publish CLI
        working-directory: packages/cli
        run: npm publish --access public
